name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "build-tools;33.0.2" "build-tools;34.0.0" "platforms;android-33" "platforms;android-34" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Download Godot export templates
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -o godot_export_templates.tpz
          test -s godot_export_templates.tpz

      - name: Build APK with Godot CI image
        run: |
          mkdir -p build
          docker run --rm \
            --entrypoint /bin/bash \
            -v "${{ github.workspace }}:/root/project" \
            -v "${ANDROID_HOME}:/opt/android-sdk" \
            -e GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/root/.android/debug.keystore \
            -e GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey \
            -e GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android \
            -w /root/project \
            barichello/godot-ci:4.3 \
            -lc '
              set -euxo pipefail
              mkdir -p /root/.config/godot /root/.android
              echo "" | base64 -d > /root/.config/godot/editor_settings-4.3.tres
              if [ ! -f /root/.android/debug.keystore ]; then
                keytool -genkeypair -v -keystore /root/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
              fi
              echo "=== Java environment ==="
              java -version
              test -x /usr/lib/jvm/java-17-openjdk-amd64/bin/java
              test -x /usr/lib/jvm/java-17-openjdk-amd64/bin/keytool
              echo "=== Android SDK checks ==="
              test -x /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager
              test -x /opt/android-sdk/platform-tools/adb
              test -x /opt/android-sdk/build-tools/34.0.0/apksigner
              test -d /opt/android-sdk/platforms/android-34
              test -d /opt/android-sdk/build-tools/34.0.0
              mkdir -p /tmp/godot_export_templates /root/.local/share/godot/export_templates/4.3.stable
              unzip -oq /root/project/godot_export_templates.tpz -d /tmp/godot_export_templates
              cp -a /tmp/godot_export_templates/templates/. /root/.local/share/godot/export_templates/4.3.stable/
              test -s /root/.local/share/godot/export_templates/4.3.stable/android_debug.apk
              test -s /root/.local/share/godot/export_templates/4.3.stable/android_release.apk
              godot --headless --editor --path /root/project --quit --verbose 2>&1 | tee /tmp/godot-import.log
              if grep -E "SCRIPT ERROR:|Failed to load script" /tmp/godot-import.log; then
                echo "Godot script validation failed during import"
                exit 1
              fi
              godot --headless --path /root/project --quit-after 3 --verbose 2>&1 | tee /tmp/godot-run.log
              if grep -E "SCRIPT ERROR:|Failed to load script" /tmp/godot-run.log; then
                echo "Godot runtime smoke test failed"
                exit 1
              fi
              godot --headless --verbose --path /root/project --export-debug "Android" /root/project/build/zone-first-exit.apk 2>&1 | tee /tmp/godot-export.log
              if grep -E "SCRIPT ERROR:|Failed to load script" /tmp/godot-export.log; then
                echo "Godot script validation failed during export"
                exit 1
              fi
              test -s /root/project/build/zone-first-exit.apk
            '

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zone-first-exit-apk
          path: build/zone-first-exit.apk
          if-no-files-found: error
          retention-days: 14
