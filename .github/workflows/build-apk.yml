name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "build-tools;33.0.2" "build-tools;34.0.0" "platforms;android-33" "platforms;android-34" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Build APK with Godot CI image
        run: |
          mkdir -p build
          docker run --rm \
            --entrypoint /bin/bash \
            -v "${{ github.workspace }}:/root/project" \
            -v "${ANDROID_HOME}:/opt/android-sdk" \
            -w /root/project \
            barichello/godot-ci:4.3 \
            -lc '
              set -euxo pipefail
              mkdir -p /root/.config/godot /root/.android
              printf "%s\\n" \
                "[gd_resource type=\\"EditorSettings\\" format=3]" \
                "" \
                "[resource]" \
                "export/android/java_sdk_path = \\"/usr/lib/jvm/java-17-openjdk-amd64\\"" \
                "export/android/android_sdk_path = \\"/opt/android-sdk\\"" \
                "export/android/debug_keystore = \\"/root/.android/debug.keystore\\"" \
                "export/android/debug_keystore_user = \\"androiddebugkey\\"" \
                "export/android/debug_keystore_pass = \\"android\\"" \
                > /root/.config/godot/editor_settings-4.3.tres
              if [ ! -f /root/.android/debug.keystore ]; then
                keytool -genkeypair -v -keystore /root/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
              fi
              test -x /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager
              test -d /opt/android-sdk/platforms/android-34
              test -d /opt/android-sdk/build-tools/34.0.0
              godot --headless --editor --path /root/project --quit
              godot --headless --path /root/project --export-debug "Android" /root/project/build/zone-first-exit.apk
              test -s /root/project/build/zone-first-exit.apk
            '

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zone-first-exit-apk
          path: build/zone-first-exit.apk
          if-no-files-found: error
          retention-days: 14
