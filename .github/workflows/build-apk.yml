name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build APK with Godot CI image
        run: |
          mkdir -p build
          docker run --rm \
            -v "${{ github.workspace }}:/root/project" \
            -w /root/project \
            barichello/godot-ci:4.3 \
            godot --headless --path /root/project --export-debug "Android" /root/project/build/zone-first-exit.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zone-first-exit-apk
          path: build/zone-first-exit.apk
          if-no-files-found: error
          retention-days: 14
